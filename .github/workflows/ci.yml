name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --all-targets

  python:
    # Exercise the Python/NumPy boundary on each OS, plus both supported ABI
    # endpoints. Rust-only tests do not cover extension loading or array layout.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: macos-15
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SOUND_RS_PLAY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: python -m pip install maturin numpy
      - run: maturin build --release --locked -o dist
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist sound_rs
      - run: python tests/smoke.py
      - run: python tests/decode_regression.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python docs/check_api.py
      - run: python bench/test_stats.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/_build.py
      - run: python3 docs/check_api.py
      - run: python3 docs/check_site.py
      - run: git diff --exit-code docs/
