name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test

  wheels:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # abi3-py310: one wheel per platform covers Python 3.10 to 3.14.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          # manylinux container ships no ALSA headers, cpal needs them
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then yum install -y alsa-lib-devel;
            else apt-get update && apt-get install -y libasound2-dev; fi
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
      - name: Check bundled ALSA runtime
        if: runner.os == 'Linux'
        run: unzip -l dist/*.whl | grep -q 'sound_rs.libs/libasound'
      - name: Validate wheel API and samples
        shell: bash
        env:
          SOUND_RS_PLAY: "0"
        run: |
          python -m pip install numpy
          python -m pip install --force-reinstall --no-deps --no-index --find-links dist sound_rs
          python tests/smoke.py
          python tests/decode_regression.py
          python -m unittest discover -s tests -p "test_*.py" -v

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels-musl:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test in Alpine
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.12-alpine sh -c '
            apk add --no-cache build-base python3-dev py3-pip py3-numpy alsa-lib-dev pkgconf patchelf wget &&
            wget -qO- https://github.com/PyO3/maturin/releases/download/v1.16.0/maturin-$(uname -m)-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin &&
            maturin build --release --out dist &&
            python3 -m pip install --break-system-packages --no-deps --no-index --find-links dist sound_rs &&
            python3 tests/smoke.py
          '
      - name: Check bundled ALSA runtime
        run: unzip -l dist/*.whl | grep -q 'sound_rs.libs/libasound'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-musl-x86_64
          path: dist/*.whl

  publish:
    needs: [wheels, wheels-musl, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
