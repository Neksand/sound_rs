[package]
name = "sound_rs"
version = "0.3.0"
edition = "2021"

[lib]
name = "sound_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = "0.15"
pyo3 = { version = "0.25.0" }
numpy = { version = "0.25.0", optional = true }
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "aac", "isomp4", "wav"] }
rubato = "5.0.1"
rtrb = "0.4.1"
rayon = "1.12.0"
minimp3 = "0.6.1"

[features]
default = ["numpy"]
# numpy: play_array() accepts ndarrays. On by default.
numpy = ["dep:numpy"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
debug = false

[dev-dependencies]
proptest = "1.12.0"
