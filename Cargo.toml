[package]
name = "sound_rs"
version = "0.1.7"
edition = "2021"

[lib]
name = "sound_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = "0.15"
pyo3 = { version = "0.25.0" }
numpy = { version = "0.25.0", optional = true }
symphonia = { version = "0.5", features = ["mp3", "flac", "vorbis", "aac", "isomp4", "wav"] }

[features]
default = ["numpy"]
# numpy: play_array() accepts ndarrays. On by default.
numpy = ["dep:numpy"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
debug = false
