[package]
name = "sound_rs"
version = "0.7.0"
edition = "2021"

[lib]
name = "sound_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = "0.15"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
numpy = { version = "0.29.0", optional = true }
symphonia = { version = "0.5", default-features = false, features = [
    "aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav",
] }
rubato = "5.0.1"
rtrb = "0.4.1"
rayon = "1.12.0"
serde_json = "1.0"

[features]
default = ["numpy"]
# numpy: play_array() accepts ndarrays. On by default.
numpy = ["dep:numpy"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
debug = false

[dev-dependencies]
proptest = "1.12.0"
